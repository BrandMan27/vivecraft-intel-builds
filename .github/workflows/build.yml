name: Build Intel-patched Vivecraft

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: space-separated upstream tags to build (for testing)"
        required: false
      retry_failed:
        description: "Retry tags that failed before"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has: ${{ steps.m.outputs.has }}
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          ONLY: ${{ inputs.only }}
          RETRY: ${{ inputs.retry_failed }}
        run: |
          [ -f status.json ] || echo '{}' > status.json
          git ls-remote --tags --refs https://github.com/Vivecraft/VivecraftMod \
            | sed 's|.*refs/tags/||' \
            | grep -E '^(1|26)\.[0-9]+(\.[0-9]+)?-[0-9]' | sort -V > all.txt
          if [ -n "$ONLY" ]; then
            tr ' ' '\n' <<< "$ONLY" > sel.txt
          else
            if [ "$RETRY" = true ]; then
              jq -r 'to_entries[]|select(.value!="failed")|.key' status.json > done.txt
            else
              jq -r 'keys[]' status.json > done.txt
            fi
            grep -vxFf done.txt all.txt | head -n 250 > sel.txt || true
          fi
          cat sel.txt
          if [ -s sel.txt ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$(jq -Rsc 'split("\n")|map(select(length>0))|{tag:.}' sel.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.has == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: self

      - name: Clone official Vivecraft at this tag
        run: git clone --depth 1 --branch "${{ matrix.tag }}" https://github.com/Vivecraft/VivecraftMod src

      - name: Pick Java version
        id: j
        run: |
          case "${{ matrix.tag }}" in
            1.20.5*|1.20.6*|1.21*) v=21 ;;
            26*)                   v=25 ;;
            *)                     v=17 ;;
          esac
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.j.outputs.v }}

      - name: Disable the Intel block
        id: p
        working-directory: src
        run: |
          f=$(grep -rl "blockIntelWindows = true" --include=VRSettings.java . || true)
          if [ -n "$f" ]; then
            sed -i 's/blockIntelWindows = true/blockIntelWindows = false/' $f
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ -f "../self/patches/${{ matrix.tag }}.patch" ]; then
            git apply "../self/patches/${{ matrix.tag }}.patch"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        id: b
        if: steps.p.outputs.found == 'true'
        continue-on-error: true
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Release jars
        id: r
        if: steps.p.outputs.found == 'true' && steps.b.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          for loader in fabric forge neoforge; do
            jar=$(ls -S src/$loader/build/libs/*.jar 2>/dev/null | grep -v -E '(-sources|-javadoc|-dev|transformProduction)' | head -n 1 || true)
            if [ -n "$jar" ]; then
              cp "$jar" "out/vivecraft-${{ matrix.tag }}-$loader.jar"
            fi
          done
          ls out
          if [ -z "$(ls -A out)" ]; then echo "no jars found"; exit 1; fi
          gh release delete "intel-${{ matrix.tag }}" -y --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "intel-${{ matrix.tag }}" out/*.jar --repo "$GITHUB_REPOSITORY" \
            --title "Vivecraft ${{ matrix.tag }} (Intel patch)" \
            --notes "Unofficial build of Vivecraft ${{ matrix.tag }} with blockIntelWindows defaulted to false. Download the jar for your mod loader (fabric, forge or neoforge)."

      - name: Record result
        if: always()
        run: |
          if [ "${{ steps.p.outputs.found }}" = "false" ]; then s=no-patch
          elif [ "${{ steps.r.outcome }}" = "success" ]; then s=built
          else s=failed; fi
          mkdir -p res
          echo "{\"${{ matrix.tag }}\": \"$s\"}" > res/${{ matrix.tag }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.tag }}
          path: res/*.json

  readme:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.outputs.has == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true
          path: res
      - name: Update status.json and README.md
        run: |
          python3 - <<'EOF'
          import json, glob, os, re
          st = json.load(open("status.json")) if os.path.exists("status.json") else {}
          for f in glob.glob("res/*.json"):
              st.update(json.load(open(f)))
          json.dump(st, open("status.json", "w"), indent=1, sort_keys=True)

          repo = os.environ["GITHUB_REPOSITORY"]
          key = lambda t: [int(x) if x.isdigit() else 0 for x in re.split(r"[.\-]", t)]
          by_mc = {}
          for tag, s in st.items():
              by_mc.setdefault(tag.split("-")[0], []).append((tag, s))
          lines = [
            "# Vivecraft Intel-patched builds", "",
            "Unofficial builds of Vivecraft with the Intel GPU block disabled (`blockIntelWindows` defaults to `false`).",
            "Built automatically from the official source. Not affiliated with or endorsed by Vivecraft.", "",
            "Each download has one jar per mod loader (fabric, forge, neoforge), named like `vivecraft-1.20.1-1.3.15-fabric.jar`.", "",
            "Legend: built = download available, no-patch = setting not found in that version, failed = build error.", "",
            "| Minecraft | Vivecraft version | Status |", "|---|---|---|"]
          for mc in sorted(by_mc, key=key, reverse=True):
              for tag, s in sorted(by_mc[mc], key=lambda x: key(x[0]), reverse=True):
                  cell = f"[download](https://github.com/{repo}/releases/tag/intel-{tag})" if s == "built" else s
                  lines.append(f"| {mc} | {tag} | {cell} |")
          open("README.md", "w").write("\n".join(lines) + "\n")
          EOF
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add status.json README.md
          git diff --cached --quiet || git commit -m "Update build status" && git push
