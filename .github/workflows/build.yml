name: Build Intel-patched Vivecraft

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: space-separated upstream tags to build (for testing)"
        required: false
      retry_failed:
        description: "Retry tags that failed or had no patch before"
        type: boolean
        default: false
      recover_run_id:
        description: "Optional: run ID of an earlier run whose jars should be published (skips all builds)"
        required: false
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has: ${{ steps.m.outputs.has }}
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          ONLY: ${{ inputs.only }}
          RETRY: ${{ inputs.retry_failed }}
          RECOVER: ${{ inputs.recover_run_id }}
        run: |
          if [ -n "$RECOVER" ]; then
            echo "has=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ -f status.json ] || echo '{}' > status.json
          git ls-remote --tags --refs https://github.com/Vivecraft/VivecraftMod \
            | sed 's|.*refs/tags/||' \
            | grep -E '^(1|26)\.[0-9]+(\.[0-9]+)?-[0-9]' | sort -V > all.txt
          if [ -n "$ONLY" ]; then
            tr ' ' '\n' <<< "$ONLY" > sel.txt
          else
            if [ "$RETRY" = true ]; then
              jq -r 'to_entries[]|select(.value=="built")|.key' status.json > done.txt
            else
              jq -r 'keys[]' status.json > done.txt
            fi
            grep -vxFf done.txt all.txt | head -n 250 > sel.txt || true
          fi
          cat sel.txt
          if [ -s sel.txt ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$(jq -Rsc 'split("\n")|map(select(length>0))|{tag:.}' sel.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.has == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: self

      - name: Clone official Vivecraft at this tag
        run: git clone --depth 1 --branch "${{ matrix.tag }}" https://github.com/Vivecraft/VivecraftMod src

      - name: Pick Java version
        id: j
        run: |
          case "${{ matrix.tag }}" in
            1.20.5*|1.20.6*|1.21*) v=21 ;;
            26*)                   v=25 ;;
            *)                     v=17 ;;
          esac
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.j.outputs.v }}

      - name: Disable the Intel block
        id: p
        working-directory: src
        run: |
          f=$(grep -rl "blockIntelWindows = true" --include=VRSettings.java . || true)
          if [ -n "$f" ]; then
            sed -i 's/blockIntelWindows = true/blockIntelWindows = false/' $f
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            g=$(grep -rlF 'getRenderer().toLowerCase().contains("intel")' --include=*.java . || true)
            if [ -n "$g" ]; then
              sed -i '/getRenderer().toLowerCase().contains("intel")/ s/if *(/if (false \&\& /' $g
            fi
            if [ -n "$g" ] && grep -rqE 'if \(false && .*getRenderer\(\)' $g; then
              echo "found=true" >> "$GITHUB_OUTPUT"
            elif [ -f "../self/patches/${{ matrix.tag }}.patch" ]; then
              git apply "../self/patches/${{ matrix.tag }}.patch"
              echo "found=true" >> "$GITHUB_OUTPUT"
            else
              echo "found=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build
        id: b
        if: steps.p.outputs.found == 'true'
        continue-on-error: true
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Collect jars
        id: r
        if: steps.p.outputs.found == 'true' && steps.b.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p out
          for loader in fabric forge neoforge; do
            jar=$(ls -S src/$loader/build/libs/*.jar 2>/dev/null | grep -v -E '(-sources|-javadoc|-dev|transformProduction)' | head -n 1 || true)
            if [ -n "$jar" ]; then
              cp "$jar" "out/vivecraft-${{ matrix.tag }}-$loader.jar"
            fi
          done
          ls out
          [ -n "$(ls -A out)" ]

      - uses: actions/upload-artifact@v4
        if: steps.r.outcome == 'success'
        with:
          name: jars-${{ matrix.tag }}
          path: out/*.jar

      - name: Record result
        if: always()
        run: |
          if [ "${{ steps.p.outputs.found }}" = "false" ]; then s=no-patch
          elif [ "${{ steps.r.outcome }}" = "success" ]; then s=built
          else s=failed; fi
          mkdir -p res
          echo "{\"${{ matrix.tag }}\": \"$s\"}" > res/${{ matrix.tag }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.tag }}
          path: res/*.json

  publish:
    needs: [plan, build]
    if: ${{ !cancelled() && (needs.plan.outputs.has == 'true' || inputs.recover_run_id != '') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RECOVER: ${{ inputs.recover_run_id }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: jars-*
          merge-multiple: true
          path: out
          run-id: ${{ inputs.recover_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Publish into one release per Minecraft family
        run: |
          python3 - <<'EOF'
          import os, re, glob, subprocess, tempfile, shutil, json

          repo = os.environ["GITHUB_REPOSITORY"]

          def gh(*args, check=True):
              r = subprocess.run(["gh", *args, "--repo", repo], capture_output=True, text=True)
              if check and r.returncode != 0:
                  raise SystemExit("gh " + " ".join(args) + " failed:\n" + r.stdout + "\n" + r.stderr)
              return r

          def fam(mc):
              return "26" if mc.startswith("26") else ".".join(mc.split(".")[:2])

          def ensure(f):
              if gh("release", "view", "intel-" + f, check=False).returncode != 0:
                  gh("release", "create", "intel-" + f,
                     "--title", "Vivecraft for Minecraft " + f + ".x (Intel patch)",
                     "--notes", "All Intel-patched Vivecraft builds for Minecraft " + f + ".x. Files are named vivecraft-MINECRAFT-VIVECRAFTVERSION-LOADER.jar. See the README for the latest build of each Minecraft version.")

          new_jars = glob.glob("out/vivecraft-*.jar")
          if os.environ.get("RECOVER") and not new_jars:
              raise SystemExit("Recovery run found no jars to publish. Check the download-artifact step and the permissions block.")

          # one-time migration of old per-tag releases into family releases
          rels = json.loads(gh("release", "list", "--limit", "1000", "--json", "tagName").stdout or "[]")
          for r in rels:
              t = r["tagName"]
              m = re.match(r"intel-((?:1|26)\.\d+(?:\.\d+)?)-", t)
              if not m:
                  continue
              f = fam(m.group(1))
              ensure(f)
              d = tempfile.mkdtemp()
              gh("release", "download", t, "--pattern", "*.jar", "--dir", d, check=False)
              jars = glob.glob(d + "/*.jar")
              if jars:
                  if gh("release", "upload", "intel-" + f, *jars, "--clobber", check=False).returncode == 0:
                      gh("release", "delete", t, "--cleanup-tag", "-y", check=False)
              shutil.rmtree(d)

          # new builds
          groups = {}
          for p in new_jars:
              mc = os.path.basename(p).split("-")[1]
              groups.setdefault(fam(mc), []).append(p)
          for f, paths in groups.items():
              ensure(f)
              gh("release", "upload", "intel-" + f, *paths, "--clobber")
              print("uploaded", len(paths), "jars to intel-" + f)
          EOF

  readme:
    needs: [plan, build, publish]
    if: ${{ !cancelled() && (needs.plan.outputs.has == 'true' || inputs.recover_run_id != '') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: result-*
          merge-multiple: true
          path: res
          run-id: ${{ inputs.recover_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Update status.json and README.md
        run: |
          python3 - <<'EOF'
          import json, glob, os, re, subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          st = json.load(open("status.json")) if os.path.exists("status.json") else {}
          for f in glob.glob("res/*.json"):
              st.update(json.load(open(f)))
          json.dump(st, open("status.json", "w"), indent=1, sort_keys=True)

          key = lambda t: [int(x) if x.isdigit() else 0 for x in re.split(r"[.\-]", t)]
          fam = lambda mc: "26" if mc.startswith("26") else ".".join(mc.split(".")[:2])

          builds = {}
          rels = json.loads(subprocess.check_output(
              ["gh", "release", "list", "--repo", repo, "--limit", "200", "--json", "tagName"]))
          for r in rels:
              t = r["tagName"]
              if not t.startswith("intel-"):
                  continue
              assets = json.loads(subprocess.check_output(
                  ["gh", "release", "view", t, "--repo", repo, "--json", "assets"]))["assets"]
              for a in assets:
                  m = re.match(r"vivecraft-(.+)-(fabric|forge|neoforge)\.jar$", a["name"])
                  if m:
                      builds.setdefault(m.group(1), {})[m.group(2)] = a["url"]

          def links(d):
              return " · ".join(f"[{l}]({d[l]})" for l in ("fabric", "forge", "neoforge") if l in d)

          by_mc = {}
          for tag in builds:
              by_mc.setdefault(tag.split("-")[0], []).append(tag)

          L = ["# Vivecraft Intel-patched builds", "",
               "Unofficial builds of Vivecraft with the Intel GPU block disabled. Built automatically from the official source. Not affiliated with or endorsed by Vivecraft.", "",
               "Download the jar for your mod loader (Fabric, Forge or NeoForge) and use only one Vivecraft jar per instance.", "",
               "## Latest build for each Minecraft version", "",
               "| Minecraft | Vivecraft | Download |", "|---|---|---|"]
          for mc in sorted(by_mc, key=key, reverse=True):
              tag = sorted(by_mc[mc], key=key, reverse=True)[0]
              L.append(f"| {mc} | {tag.split('-', 1)[1]} | {links(builds[tag])} |")

          L += ["", "## All builds", ""]
          fams = {}
          for mc in by_mc:
              fams.setdefault(fam(mc), []).append(mc)
          for f in sorted(fams, key=key, reverse=True):
              tags = [t for mc in fams[f] for t in by_mc[mc]]
              L += [f"<details><summary>Minecraft {f}.x ({len(tags)} builds)</summary>", "",
                    f"[Release page](https://github.com/{repo}/releases/tag/intel-{f})", "",
                    "| Minecraft | Vivecraft | Download |", "|---|---|---|"]
              for tag in sorted(tags, key=key, reverse=True):
                  mc, v = tag.split("-", 1)
                  L.append(f"| {mc} | {v} | {links(builds[tag])} |")
              L += ["", "</details>", ""]

          bad = sorted([t for t, s in st.items() if s in ("no-patch", "failed")], key=key, reverse=True)
          if bad:
              L += [f"<details><summary>Not patched ({len(bad)} versions)</summary>", "",
                    "These have no jar: either the Intel check wasn't found or the build failed.", ""]
              L += [f"- {t} ({st[t]})" for t in bad]
              L += ["", "</details>", ""]

          open("README.md", "w").write("\n".join(L))
          EOF
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add status.json README.md
          git diff --cached --quiet || git commit -m "Update build status" && git push
