name: Build Intel-patched Vivecraft

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: space-separated upstream tags to build (for testing)"
        required: false
      retry_failed:
        description: "Retry tags that failed or had no patch before"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has: ${{ steps.m.outputs.has }}
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          ONLY: ${{ inputs.only }}
          RETRY: ${{ inputs.retry_failed }}
        run: |
          [ -f status.json ] || echo '{}' > status.json
          git ls-remote --tags --refs https://github.com/Vivecraft/VivecraftMod \
            | sed 's|.*refs/tags/||' \
            | grep -E '^(1|26)\.[0-9]+(\.[0-9]+)?-[0-9]' | sort -V > all.txt
          if [ -n "$ONLY" ]; then
            tr ' ' '\n' <<< "$ONLY" > sel.txt
          else
            if [ "$RETRY" = true ]; then
              jq -r 'to_entries[]|select(.value=="built")|.key' status.json > done.txt
            else
              jq -r 'keys[]' status.json > done.txt
            fi
            grep -vxFf done.txt all.txt | head -n 250 > sel.txt || true
          fi
          cat sel.txt
          if [ -s sel.txt ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            echo "matrix=$(jq -Rsc 'split("\n")|map(select(length>0))|{tag:.}' sel.txt)" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.has == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: self

      - name: Clone official Vivecraft at this tag
        run: git clone --depth 1 --branch "${{ matrix.tag }}" https://github.com/Vivecraft/VivecraftMod src

      - name: Pick Java version
        id: j
        run: |
          case "${{ matrix.tag }}" in
            1.20.5*|1.20.6*|1.21*) v=21 ;;
            26*)                   v=25 ;;
            *)                     v=17 ;;
          esac
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.j.outputs.v }}

      - name: Disable the Intel block
        id: p
        working-directory: src
        run: |
          f=$(grep -rl "blockIntelWindows = true" --include=VRSettings.java . || true)
          if [ -n "$f" ]; then
            sed -i 's/blockIntelWindows = true/blockIntelWindows = false/' $f
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            g=$(grep -rlF 'getRenderer().toLowerCase().contains("intel")' --include=*.java . || true)
            if [ -n "$g" ]; then
              sed -i '/getRenderer().toLowerCase().contains("intel")/ s/if *(/if (false \&\& /' $g
            fi
            if [ -n "$g" ] && grep -rqE 'if \(false && .*getRenderer\(\)' $g; then
              echo "found=true" >> "$GITHUB_OUTPUT"
            elif [ -f "../self/patches/${{ matrix.tag }}.patch" ]; then
              git apply "../self/patches/${{ matrix.tag }}.patch"
              echo "found=true" >> "$GITHUB_OUTPUT"
            else
              echo "found=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build
        id: b
        if: steps.p.outputs.found == 'true'
        continue-on-error: true
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Collect jars
        id: r
        if: steps.p.outputs.found == 'true' && steps.b.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p out
          for loader in fabric forge neoforge; do
            jar=$(ls -S src/$loader/build/libs/*.jar 2>/dev/null | grep -v -E '(-sources|-javadoc|-dev|transformProduction)' | head -n 1 || true)
            if [ -n "$jar" ]; then
              cp "$jar" "out/vivecraft-${{ matrix.tag }}-$loader.jar"
            fi
          done
          ls out
          [ -n "$(ls -A out)" ]

      - uses: actions/upload-artifact@v4
        if: steps.r.outcome == 'success'
        with:
          name: jars-${{ matrix.tag }}
          path: out/*.jar

      - name: Record result
        if: always()
        run: |
          if [ "${{ steps.p.outputs.found }}" = "false" ]; then s=no-patch
          elif [ "${{ steps.r.outcome }}" = "success" ]; then s=built
          else s=failed; fi
          mkdir -p res
          echo "{\"${{ matrix.tag }}\": \"$s\"}" > res/${{ matrix.tag }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.tag }}
          path: res/*.json

  publish:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.outputs.has == 'true' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: jars-*
          merge-multiple: true
          path: out

      - name: Publish into one release per Minecraft family
        run: |
          R="$GITHUB_REPOSITORY"
          fam() { case "$1" in 26*) echo 26 ;; *) echo "$1" | cut -d. -f1,2 ;; esac; }
          ensure() {
            gh release view "intel-$1" --repo "$R" >/dev/null 2>&1 || \
              gh release create "intel-$1" --repo "$R" \
                --title "Vivecraft for Minecraft $1.x (Intel patch)" \
                --notes "All Intel-patched Vivecraft builds for Minecraft $1.x. Files are named vivecraft-<minecraft>-<vivecraft version>-<loader>.jar. See the README for the latest build of each Minecraft version."
          }

          # one-time migration of old per-tag releases into family releases
          mkdir -p mig
          for t in $(gh release list --repo "$R" --limit 1000 --json tagName -q '.[].tagName' | grep -E '^intel-(1|26)\.[0-9]+(\.[0-9]+)?-' || true); do
            mc=${t#intel-}; mc=${mc%%-*}
            f=$(fam "$mc")
            ensure "$f"
            rm -f mig/*
            gh release download "$t" --repo "$R" --pattern '*.jar' --dir mig || true
            if ls mig/*.jar >/dev/null 2>&1; then
              if gh release upload "intel-$f" mig/*.jar --repo "$R" --clobber; then
                gh release delete "$t" --repo
